<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0f;
            color: #f5f0e8;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        #loginScreen {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #107c66;
          color: #f5f0e8;
          font-family: Arial, sans-serif;
        }

        .lock-panel {
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;
            text-align: center;
            background: #101014;
            border: 1px solid #292025;
            border-top: 3px solid #18bc9c;
            border-radius: 8px;
        }

        .lock-panel h2 {
            margin: 0 0 25px;
            font-size: 24px;
        }

        .lock-input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            background: #0b0b0f;
            color: #f5f0e8;
            border: 1px solid #393039;
            border-radius: 4px;
            font-size: 16px;
        }

        .lock-input:focus {
            outline: none;
            border-color: #18bc9c;
        }

        #unlockButton {
            width: 100%;
            padding: 13px;
            background: #18bc9c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #unlockButton:hover {
            background: #1ddbb5;
        }

        #errorMessage {
            min-height: 18px;
            margin-bottom: 0;
            color: #18bc9c;
            font-size: 14px;
        }

        nav {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #101014;
            border-bottom: 1px solid #292025;
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .logo span {
            color: #ff303f;
        }

        .hero {
            padding: 90px 7% 65px;
            background:
                linear-gradient(rgba(11,11,15,.35), rgba(11,11,15,.75)),
                url("img/background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            text-align: center;
        }

        .eyebrow {
            color: #ff4554;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 85px);
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 1.05;
            text-transform: uppercase;
        }

        .hero h1 span {
            color: #ff303f;
        }

        .hero p {
            color: #aaa4aa;
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        .divider {
            width: 65px;
            height: 4px;
            background: #ff303f;
            margin: 30px auto 0;
            border-radius: 10px;
        }

        .library {
            max-width: 1450px;
            margin: auto;
            padding: 10px 5% 100px;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .section-heading h2 {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .game-count {
            color: #888;
            font-size: 13px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
        }

        .game-card {
            background: #151519;
            border: 1px solid #30252a;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            min-width: 0;
            transition:
                transform .25s ease,
                border-color .25s ease,
                box-shadow .25s ease;
        }

        .game-card:hover {
            border-color: #ff303e;
            box-shadow: 0 12px 35px #ff303f20;
        }

        .image-container {
            height: 230px;
            overflow: hidden;
            background: #250d12;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .4s ease;
        }

        .game-card:hover img {
            transform: scale(1.06);
        }

        .card-content {
            padding: 23px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-content h3 {
            font-size: 23px;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-content p {
            color: #99939a;
            font-size: 13px;
            line-height: 1.7;
            flex: 1;
            margin-bottom: 23px;
        }

        footer {
            border-top: 1px solid #292025;
            padding: 25px;
            text-align: center;
            color: #68636a;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 800px) {
            .games {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            .games {
                grid-template-columns: 1fr;
            }

            .hero {
                padding-top: 65px;
            }
        }
    </style>
</head>

<body>
  <div>
    <div id="loginScreen">
        <div class="lock-panel">
            <h2>Enter Code For Billy!</h2>

            <form id="loginForm">
                <input
                    type="password"
                    id="codeInput"
                    class="lock-input"
                    placeholder="Enter Code"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="unlockButton">
                    Unlock
                </button>

                <p id="errorMessage" role="status"></p>
            </form>
        </div>
    </div>

    <div id="website">

        <nav>
            <div class="logo">AMA<span>DITE</span></div>
        </nav>

        <header class="hero">
            <div class="eyebrow">Made By Floppa9.</div>

            <h1>ama<span>dite</span></h1>

            <p id="randomText"></p>

            <div class="divider"></div>
        </header>

        <main class="library">

            <div class="section-heading">
                <h2>Games</h2>
                <div class="game-count">03 GAMES</div>
            </div>

            <div class="games">

                <!-- GAME 1 -->

                <a class="game-card"
                   href="games/Funkin-HTML-Port-main/index.html">

                    <div class="image-container">
                        <img src="img/fnf.jpg" alt="Friday Night Funkin'">
                    </div>

                    <div class="card-content">
                        <h3>Friday Night Funkin'</h3>
                        <p>Hit arrows to the song. come on you know this.</p>
                    </div>
                </a>

                <!-- GAME 2 -->

                <a class="game-card" href="games/scary.html">

                    <div class="image-container">
                        <img src="img/fnf1.png" alt="Scary game">
                    </div>

                    <div class="card-content">
                        <h3>Scary</h3>
                        <p>GAY</p>
                    </div>
                </a>

                <!-- GAME 3 -->

                <a class="game-card" href="games/game3.html">

                    <div class="image-container">
                        <img src="img/fnf1.png" alt="Game 3">
                    </div>

                    <div class="card-content">
                        <h3>Game 03</h3>
                        <p>GAY</p>
                    </div>
                </a>

            </div>
        </main>

        <footer>
            Billys Games 2026
        </footer>

    </div>


  <script>
      const ACCESS_CODE = "nolearn";

      const loginForm = document.getElementById("loginForm");
      const codeInput = document.getElementById("codeInput");
      const errorMessage = document.getElementById("errorMessage");
      const loginScreen = document.getElementById("loginScreen");
      const website = document.getElementById("website");

      website.style.display = "none";

      loginForm.addEventListener("submit", function(event) {
          event.preventDefault();

          if (codeInput.value === ACCESS_CODE) {
              sessionStorage.setItem("billyAccessGranted", "yes");

              loginScreen.style.display = "none";
              website.style.display = "block";

              showRandomText();
          } else {
              errorMessage.textContent = "Incorrect code. Try again.";
              codeInput.value = "";
              codeInput.focus();
          }
      });

      function showRandomText() {
          const messages = [
              "you like my games?",
              "This took too long.",
              "You want my games? You can have them! I left all the games I gathered together in one place! Now you just have to find it!",
              "Why tf you looking at this?",
              "GOON."
          ];

          const randomVar = Math.floor(Math.random() * messages.length);

          document.getElementById("randomText").textContent =
              messages[randomVar];
      }
  </script>
</body>
</html>
